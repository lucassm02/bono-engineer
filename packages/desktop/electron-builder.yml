# Windows package. No code signing and no admin rights needed:
#  - "nsis": one-click installer for the CURRENT user (%LOCALAPPDATA%\Programs), no UAC prompt;
#  - "portable": a single .exe that runs from anywhere (extracts to a temp folder on each start).
appId: com.lucas.bonoengineer
productName: Bono Engineer
copyright: Projeto pessoal
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true
# The only native addon (PNG charts of the MCP tool): the .node file cannot be loaded from inside
# the asar archive, so it is shipped next to it (app.asar.unpacked).
asarUnpack:
  - "**/node_modules/@resvg/**"
# Only the languages the app can show (saves ~40 MB of Chromium locale files).
electronLanguages:
  - pt-BR
  - en-US
npmRebuild: false
buildDependenciesFromSource: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  guid: 9d335344-a700-5f11-a862-c0085db2e32b # preserve the installed product's upgrade key
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false # the history lives in %APPDATA%\Bono Engineer: never removed
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bono Engineer
  artifactName: Bono-Engineer-Setup-${version}.${ext}
portable:
  artifactName: Bono-Engineer-${version}-portable.${ext}
