name: Windows build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate version and prepare release notes
        id: release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/bono-release" | Out-Null
          node scripts/release-notes.mjs "$env:RUNNER_TEMP/bono-release/release-notes.md"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows installer and portable app
        env:
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: npm run desktop:dist -- --publish never
      - name: Stage Windows binaries
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = "$env:RUNNER_TEMP/bono-release"
          Copy-Item -LiteralPath "packages/desktop/release/Bono-Engineer-Setup-${env:VERSION}.exe" -Destination $destination
          Copy-Item -LiteralPath "packages/desktop/release/Bono-Engineer-${env:VERSION}-portable.exe" -Destination $destination
          Copy-Item -LiteralPath "packages/desktop/release/Bono-Engineer-Setup-${env:VERSION}.exe.blockmap" -Destination $destination
          Copy-Item -LiteralPath "packages/desktop/release/latest.yml" -Destination $destination
          Copy-Item -LiteralPath "packages/desktop/dist/release-notes.json" -Destination $destination
          node scripts/check-update-artifacts.mjs $destination "packages/desktop/release/win-unpacked/resources/app-update.yml" $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: bono-engineer-windows-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/bono-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: windows-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bono-engineer-windows-${{ needs.windows.outputs.version }}
          path: release
      - name: Publish the package version on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease)"
          draft="$(jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag) | .isDraft' <<< "$existing")"
          if [[ "$draft" == false ]]; then
            echo "$TAG is already published."
            exit 0
          fi
          newest="$(jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' <<< "$existing" | sed -nE '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -n 1)"
          if [[ -n "$newest" && "$(printf '%s\n' "$newest" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "::error::A newer stable version ($newest) is already published."
            exit 1
          fi
          if existing_commit="$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha' 2>/dev/null)" && [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG already points to another commit."
            exit 1
          fi
          if [[ "$draft" == true ]]; then
            target="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Draft $TAG targets another commit."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Bono Engineer $VERSION" --notes-file release/release-notes.md
          fi
          gh release upload "$TAG" --clobber \
            "release/Bono-Engineer-Setup-$VERSION.exe" \
            "release/Bono-Engineer-Setup-$VERSION.exe.blockmap" \
            "release/Bono-Engineer-$VERSION-portable.exe" \
            "release/latest.yml" "release/release-notes.json"
          gh release edit "$TAG" --draft=false --latest
